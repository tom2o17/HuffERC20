
[profile.default]
solc_version = '0.8.37'
auto_detect_solc = false
optimizer = true
optimizer_runs = 200 # Default amount
ffi = true # required: foundry-huff-neo shells out to the `hnc` Huff compiler
# foundry-huff-neo compiles Huff for osaka by default; keep the test EVM in sync.
evm_version = "osaka"
# Solidity dependencies are installed by pnpm (see package.json) into node_modules/.
remappings = [
  "forge-std/=node_modules/forge-std/src/",
  "foundry-huff-neo/=node_modules/foundry-huff-neo/src/",
]

[fuzz]
runs = 1_000
